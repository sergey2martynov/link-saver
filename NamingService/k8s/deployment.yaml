apiVersion: apps/v1
kind: Deployment
metadata:
  name: namingservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: namingservice
  template:
    metadata:
      labels:
        app: namingservice
    spec:
      containers:
        - name: namingservice
          image: namingservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: Anthropic__ApiKey
              valueFrom:
                secretKeyRef:
                  name: namingservice-secrets
                  key: anthropic-api-key
            - name: Kafka__BootstrapServers
              valueFrom:
                secretKeyRef:
                  name: namingservice-secrets
                  key: kafka-bootstrap-servers
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: namingservice
spec:
  type: NodePort
  selector:
    app: namingservice
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30083
