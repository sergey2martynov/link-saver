apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: userservice-postgres-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice-postgres
  template:
    metadata:
      labels:
        app: userservice-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: userservice
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: userservice-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: userservice-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: userservice-postgres
spec:
  selector:
    app: userservice-postgres
  ports:
    - port: 5432
      targetPort: 5432
